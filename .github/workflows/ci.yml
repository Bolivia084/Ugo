name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci && npm test && npm run build
        working-directory: packages/shared

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ugo
          POSTGRES_PASSWORD: ugo_dev_password
          POSTGRES_DB: ugo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ugo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ugo:ugo_dev_password@localhost:5432/ugo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci && npm run build
        working-directory: packages/shared
      - run: npm ci
        working-directory: apps/api
      - run: npx prisma generate && npm run typecheck && npm run lint && npm test && npm run test:e2e && npm run build
        working-directory: apps/api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm test -- --ci
        working-directory: apps/mobile
      - name: Bundle both platforms
        run: npx expo export --platform android --output-dir /tmp/export-android && npx expo export --platform ios --output-dir /tmp/export-ios
        working-directory: apps/mobile

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci && npm run build
        working-directory: apps/admin

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: for e in dev staging prod; do (cd envs/$e && terraform init -backend=false -input=false && terraform validate); done
        working-directory: infra/terraform

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (high and critical fail the build)
        run: |
          for d in packages/shared apps/api apps/admin; do (cd $d && npm audit --omit=dev --audit-level=high); done
      - name: Container and IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
