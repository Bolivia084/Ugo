# Weekly dependency updates for every package, the API container and CI actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      nestjs: { patterns: ["@nestjs/*"] }
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    # Expo pins compatible versions per SDK: upgrade the SDK with `npx expo install --fix`, not one package at a time.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
  - package-ecosystem: npm
    directory: /apps/admin
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /packages/shared
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
